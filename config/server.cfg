# Configuracao comum MX, carregada pelo server.cfg deste perfil txAdmin.
sv_hostname "MX | Freeroam JDM — desenvolvimento"
sets sv_projectName "MX Freeroam"
sets sv_projectDesc "Standalone, carros livres e encontros"
sets locale "pt-BR"
sv_maxclients 20
# OneSync e definido pelo txAdmin ou development/scripts/start.ps1.
set onesync_population true
sv_enforceGameBuild 3258
sv_scriptHookAllowed 0
set mx_migrations "check"
set mysql_slow_query_warning 150
# Configure um convite https://discord.gg/... ou https://discord.com/invite/...
set mx_discordInvite ""
setr sv_showBusySpinnerOnLoadingScreen false
exec config/secrets.local.cfg
ensure oxmysql
# Categorias de assets fornecidas pelo projeto. Ordem entre categorias explicita.
exec config/assets.cfg
# Dependencias e ordem interna declaradas nos fxmanifest.lua.
ensure [mx]
exec config/voice.cfg
# add_principal identifier.license:SEU_IDENTIFICADOR group.mxadmin
add_ace group.mxadmin mx.inspect allow
add_ace group.mxadmin mx.invalidate allow
add_ace group.mxadmin mx.cleanup allow
add_ace group.mxadmin mx.content allow
add_ace group.mxadmin mx.announce allow
exec config/txadmin.local.cfg
# Cambio opcional por perfil; automatico por padrao. mx-turbo permanece sem ensure.
ensure mx-gearbox
# Som automotivo acessível pelo menu livre.
add_unsafe_child_process_permission "mx-soundcore"
ensure mx-soundcore

add_ace group.mxadmin mx.admin allow
add_ace group.mxadmin mx.warn allow
add_ace group.mxadmin mx.kick allow
add_ace group.mxadmin mx.ban allow
add_ace group.mxadmin mx.teleport allow
